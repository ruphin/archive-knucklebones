<div id="inputs">
  <button>1</button>
  <button>2</button>
  <button>3</button>
  <button>4</button>
  <button>5</button>
  <button>6</button>
  <button>   </button>
  <button>CLEAR</button>
</div>

<script type="module">
  let activeNumber = "";

  document.body.addEventListener("keyup", ({key}) => {
    if (key === " ") {
      activeNumber = "   ";
    } else if (key === "1") {
      activeNumber = key;
    } else if (key === "2") {
      activeNumber = key;
    } else if (key === "3") {
      activeNumber = key;
    } else if (key === "4") {
      activeNumber = key;
    } else if (key === "5") {
      activeNumber = key;
    } else if (key === "6") {
      activeNumber = key;
    }
  })

  document.getElementById("inputs").querySelectorAll("button").forEach(button => {
    button.addEventListener("mouseup", ({target: { textContent }})=> {
      if (textContent === "CLEAR") {
        document.getElementById("board").querySelectorAll("button").forEach(button => {
          button.innerText = "   ";
        });
      } else {
        activeNumber = textContent;
      }
    });
  });


  document.getElementById("board").querySelectorAll("button").forEach(button => {
    button.addEventListener("mouseup", (e)=> {
      e.target.textContent = activeNumber;
    });
  });

</script>
